services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: amis
      POSTGRES_USER: amis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amis -d amis"]
      interval: 5s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
  backend:
    build: ./backend/AMIS.API
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=amis;Username=amis;Password=${POSTGRES_PASSWORD}
      FRONTEND_URL: http://localhost:3000
      PUBLIC_FRONTEND_URL: ${PUBLIC_FRONTEND_URL:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-true}
      EMAIL_USERNAME: ${EMAIL_USERNAME}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - protection_keys:/root/.aspnet/DataProtection-Keys
    ports:
      - "5080:8080"
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
        API_PROXY_TARGET: http://backend:8080
    depends_on:
      - backend
    ports:
      - "3000:3000"
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://frontend:3000
    depends_on:
      - frontend
volumes:
  postgres_data:
  protection_keys:
